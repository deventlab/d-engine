[package]
name = "raft-engine-log"
version = "0.1.0"
edition = "2024"

[dependencies]
d-engine = { path = "../../d-engine" }
# raft-engine's log entries are rust-protobuf messages (`protobuf::Message`), not prost.
# default-features = false drops the `scripting` feature (rhai -> smartstring), which
# fails the license/advisory policy and is unused here.
#
# Pinned to a commit of a fork of the upstream crate, for two reasons:
# - the published 0.4.2 has a no-op `Engine::sync()` (fixed upstream in an unreleased commit);
# - upstream master pins `lz4-sys = "=1.9.5"`, which cannot coexist with the RocksDB build
#   (`lz4-sys ^1.11`; both link the native lz4 library). The fork relaxes that pin to "1.9".
# Go back to the crates.io release once it contains the sync fix and no longer pins lz4-sys.
raft-engine = { git = "https://github.com/JoshuaChi/raft-engine.git", rev = "e5ef9956540552cccc4b2a1bde1d2c5a1fb2ba9c", default-features = false }

# Needed to implement `protobuf::Message` for `EntryRecord`.
protobuf = "2"
# d-engine's `Entry`/`LogId` are prost; needed to encode/decode them.
prost = "0.13"
async-trait = "0.1"
bincode = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
# `__test_support` exposes d_engine::storage_engine_test, the shared contract suite.
d-engine = { path = "../../d-engine", features = ["__test_support"] }
tempfile = "3"
# Same major as the one raft-engine registers its metrics in, so both share one registry.
prometheus = "0.13"
