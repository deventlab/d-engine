[cluster]
node_id = 2
listen_address = "0.0.0.0:9082"
initial_cluster = [
    { id = 1, address = "0.0.0.0:9081", role = 1, status = 3 },
    { id = 2, address = "0.0.0.0:9082", role = 1, status = 3 },
    { id = 3, address = "0.0.0.0:9083", role = 1, status = 3 },
]


[raft]
general_raft_timeout_duration_in_ms = 100
cmd_channel_capacity = 1024
max_pending_append_responses = 1024

[raft.election]
election_timeout_min = 1000
election_timeout_max = 2000

[raft.read_consistency]
default_policy = "LeaseRead"
lease_duration_ms = 100

[raft.read_actor]
channel_capacity = 10240
max_drain = 2000

[raft.batching]
# Maximum number of commands to accumulate in a single batch during drain operations
max_batch_size = 200

[raft.metrics]
enable_backpressure = false
enable_batch = false


[raft.backpressure]
max_pending_writes = 1000
max_pending_reads = 500

[raft.persistence]
flush_policy = { Batch = { idle_flush_interval_ms = 1000 } }

[raft.snapshot]
enable = false
max_log_entries_before_snapshot = 5000
retained_log_entries = 100
cleanup_retain_count = 100

# == TTL Lease Configuration ==
[raft.state_machine.lease]
cleanup_interval_ms = 1000
max_cleanup_duration_ms = 1

# == Network Control Plane (voting, heartbeat, etc.) ==
[network.control]
request_timeout_in_ms = 100
connection_window_size = 4_194_304 # Increase to 4MB to reduce flow control blocking

tcp_keepalive_in_secs = 60
http2_keep_alive_interval_in_secs = 15  # Slightly increase to reduce frequent keep-alives
http2_keep_alive_timeout_in_secs = 10   # Increase timeout

# New performance tuning parameters

# == Network Data Plane (append_entries, etc.) ==
[network.data]
connect_timeout_in_ms = 100
request_timeout_in_ms = 300
connection_window_size = 8_388_608 # Increase to 8MB to support large log entries

tcp_keepalive_in_secs = 60
http2_keep_alive_interval_in_secs = 15  # Same as control plane
http2_keep_alive_timeout_in_secs = 10

# New data plane optimizations

# == Server Transport (single listener serving every RPC type) ==
[network.server]
concurrency_limit_per_connection = 100  # Increased for higher concurrent replication load
max_concurrent_streams = 4096           # Increased to reduce stream creation overhead
max_pending_accept_reset_streams = 2000 # Higher pending stream limit for Rapid Reset mitigation

[storage]
unified_db = false

# == Raft log store: read only by the `raft-engine` build (`make start-cluster`, the default build);
# the RocksDB build ignores this section. Values suit a local run (about 12 MiB of recycle pool per node);
# the library defaults are 64 / 512 / 256 / 10 and the AWS benchmark scripts write their own values.
# Log files are only released after d-engine purges the log, which happens after a snapshot. Snapshots
# are disabled above, as in the benchmark configs, so nothing is released in this setup; to watch files
# being released locally, set [raft.snapshot] enable = true (5000 entries is about 1.6 MiB of log).
# purge_threshold_mib also caps the recycle pool at 1.5 x purge_threshold_mib / target_file_size_mib
# files, so prefill_limit_mib above purge_threshold_mib has no effect.
[raft_engine]
target_file_size_mib = 1     # size at which the active log file is rotated
purge_threshold_mib = 8      # reclaim log files once the retained log exceeds this
prefill_limit_mib = 8        # zero-filled recycle pool prepared at startup: 1.5 x this many files
purge_interval_secs = 2      # how often expired log files are reclaimed
