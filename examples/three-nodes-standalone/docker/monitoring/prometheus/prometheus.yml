global:
  scrape_interval: 10s
  scrape_timeout: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "dengine"
    static_configs:
      - targets:
          - "192.168.0.11:8081"
          - "192.168.0.12:8082"
          - "192.168.0.13:8083"
        labels:
          job: "dengine"

  - job_name: "dengine-host"
    static_configs:
      - targets:
          - "host.docker.internal:8081"
          - "host.docker.internal:8082"
          - "host.docker.internal:8083"
        labels:
          job: "dengine-host"
